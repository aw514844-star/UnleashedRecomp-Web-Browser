name: webtest-build-and-deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build
        run: |
          mkdir site
          em++ webtest/main.cpp -O2 -pthread -msimd128 -sMEMORY64=1 \
            -sALLOW_MEMORY_GROWTH=1 -sMAXIMUM_MEMORY=8gb \
            -sINITIAL_MEMORY=64mb -sPTHREAD_POOL_SIZE=2 -o site/test.js
          cp webtest/index.html webtest/coi-sw.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
